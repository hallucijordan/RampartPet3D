<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>pet3d spike</title>
<style>
  /* Technical test page: shell pipeline self-check, not art */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #c { position: absolute; width: 500px; height: 600px; right: 80px; bottom: 0; cursor: grab; }
  #c.drag { cursor: grabbing; }
  #hud { position: absolute; right: 600px; bottom: 8px; margin: 0; padding: 8px 10px; width: 360px;
         font: 12px/1.45 Consolas, monospace; color: #e8f0ff; background: rgba(10, 14, 24, .78); border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c" width="500" height="600"></canvas>
<pre id="hud"></pre>
<script>
const api = window.petAPI;
const q = new URLSearchParams(location.search);
const FPS = Number(q.get('fps')) || 60;
const cv = document.getElementById('c'), hud = document.getElementById('hud');
const gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: true });

// Rotating gradient square (vertex colors), alpha = 0 outside it
const vs = `attribute vec2 p; attribute vec3 c; uniform float t; varying vec3 vc;
  void main(){ float s=sin(t), k=cos(t); vec2 r=vec2(p.x*k-p.y*s, p.x*s+p.y*k)*0.6; r.y*=500.0/600.0; gl_Position=vec4(r,0,1); vc=c; }`;
const fs = `precision mediump float; varying vec3 vc; void main(){ gl_FragColor=vec4(vc,1); }`;
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,.3,.2,  1,-1, 1,.8,.1,  -1,1, .2,.6,1,  1,1, .7,.2,1]), gl.STATIC_DRAW);
const ap = gl.getAttribLocation(prog, 'p'), ac = gl.getAttribLocation(prog, 'c');
gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 20, 0);
gl.enableVertexAttribArray(ac); gl.vertexAttribPointer(ac, 3, gl.FLOAT, false, 20, 8);
const ut = gl.getUniformLocation(prog, 't');
gl.clearColor(0, 0, 0, 0);

// Stats, read by --test-report
const S = window.__spikeStats = { fps: 0, frames: 0, fpsSamples: [], domMove: 0, key: 0, keyCls: {}, mouse: 0, button: 0, wheel: 0,
  system: 0, audio: 0, audioMax: 0, hitChecks: 0, interactive: false, lastKey: null, fg: null, fullscreen: false, idleMs: 0, peak: 0, windows: 0 };

// Cursor position (window coordinates): taken from both forwarded DOM mousemove and the global hook
let cx = -1, cy = -1, dragging = false, dragOff = null;
addEventListener('mousemove', (e) => { S.domMove++; cx = e.clientX; cy = e.clientY; });
if (api) {
  api.onMouse((m) => { S.mouse++; cx = m.lx; cy = m.ly; });
  api.onKey((k) => { if (k.type === 'down') { S.key++; S.keyCls[k.cls] = (S.keyCls[k.cls] || 0) + 1; S.lastKey = k; } });
  api.onButton(() => S.button++);
  api.onWheel(() => S.wheel++);
  api.onSystem((s) => { S.system++; S.fg = s.fg; S.fullscreen = s.fullscreen; S.idleMs = s.idleMs; S.windows = s.windows.length; });
  api.onAudio((a) => { S.audio++; S.peak = a.muted ? 0 : a.peak; S.audioMax = Math.max(S.audioMax, a.peak); S.vol = a.volume; });
}

// Dragging: pointerdown only arrives while interactive
cv.addEventListener('pointerdown', (e) => {
  dragging = true; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
  const r = cv.getBoundingClientRect(); dragOff = { x: e.clientX - r.left, y: e.clientY - r.top };
});
cv.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  cv.style.left = (e.clientX - dragOff.x) + 'px'; cv.style.top = (e.clientY - dragOff.y) + 'px';
  cv.style.right = cv.style.bottom = 'auto';
});
cv.addEventListener('pointerup', () => { dragging = false; cv.classList.remove('drag'); });

// Render + per-pixel hit test (readPixels of 1 pixel right after drawing, in the same frame)
const px = new Uint8Array(4);
let next = 0, fpsCount = 0, fpsT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now < next - 1) return;
  next = Math.max(next + 1000 / FPS, now);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(ut, now / 1000);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  S.frames++; fpsCount++;

  let hit = false;
  const r = cv.getBoundingClientRect();
  if (cx >= r.left && cx < r.right && cy >= r.top && cy < r.bottom) {
    gl.readPixels(Math.floor(cx - r.left), Math.floor(r.bottom - cy - 1), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    hit = px[3] > 25; S.hitChecks++;
  }
  S.interactive = hit || dragging;
  if (api) api.setInteractive(S.interactive);

  if (now - fpsT >= 1000) {
    S.fps = Math.round(fpsCount * 1000 / (now - fpsT)); S.fpsSamples.push(S.fps); fpsCount = 0; fpsT = now;
  }
}
requestAnimationFrame(frame);

// HUD 10 Hz
setInterval(() => {
  const k = S.lastKey, fg = S.fg;
  const bar = '#'.repeat(Math.round(S.peak * 30)).padEnd(30, '.');
  hud.textContent =
`spike  target ${FPS} fps  actual ${S.fps}   interactive ${S.interactive}
cursor ${Math.round(cx)},${Math.round(cy)}   domMove ${S.domMove}  hookMove ${S.mouse}
keys ${S.key}  ${JSON.stringify(S.keyCls)}
last  ${k ? `${k.cls} ${k.hand}${k.key ? ' ' + k.key : ''}${k.combo ? ' combo=' + k.combo : ''}` : '-'}
buttons ${S.button}  wheel ${S.wheel}
fg  ${fg ? fg.exe + '  ' + fg.title.slice(0, 32) : '-'}
fullscreen ${S.fullscreen}  idle ${(S.idleMs / 1000).toFixed(1)} s  windows ${S.windows}
audio [${bar}] ${S.peak.toFixed(3)}  vol ${S.vol != null ? S.vol.toFixed(2) : '-'}`;
}, 100);
</script>
</body>
</html>
